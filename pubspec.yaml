name: louage_go
description: Application Flutter de réservation de louages en Tunisie.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.3

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^3.4.3
  go_router: ^18.0.2
  hive_ce: ^2.20.1
  hive_ce_flutter: ^2.4.0
  path_provider: ^2.1.6
  crypto: ^3.0.7
  uuid: ^4.6.0
  intl: ^0.20.3
  qr_flutter: ^4.1.0
  mobile_scanner: ^7.4.2
  flutter_map: ^8.3.2
  latlong2: ^0.10.1
  geolocator: ^14.1.1
  flutter_local_notifications: ^22.3.1
  share_plus: ^13.3.0
  image_picker: ^1.2.3
  fl_chart: ^1.2.0
  csv: ^8.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/images/
    - assets/fonts/
